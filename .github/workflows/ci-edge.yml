name: ci-edge

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'tests/edge/**'
      - 'tests/contract/**'
      - 'src/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-edge.yml'

permissions:
  contents: read

concurrency:
  group: ci-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Edge Functions and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function tests
        run: npm run test:edge

      - name: Run contract tests
        run: npx --no-install vitest run tests/contract --passWithNoTests
